name: scripture_planner
description: New Man Christian discipline and Scripture application.
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  drift: ^2.34.2
  file_picker: ^12.0.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.1
  supabase_flutter: ^2.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: 2.1.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/kjv.json
